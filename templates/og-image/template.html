<div class="flex h-[630px] w-[1200px] flex-col justify-between bg-gradient-to-br from-indigo-950 via-indigo-800 to-sky-600 p-20 text-white">
  <p class="text-2xl font-medium uppercase tracking-widest text-sky-200">
    {{ post.category | default: "Blog" }}
  </p>
  <h1 class="text-7xl font-bold leading-tight">{{ post.title | truncate: 70 }}</h1>
  <div class="flex items-center gap-6 text-2xl">
    {{ post.author.avatar | image: width: 72, height: 72, fit: "cover", alt: post.author.name, class: "rounded-full bg-white p-2" }}
    <span>{{ post.author.name }} · {{ post.published | date: "d MMM yyyy" }} · {{ post.minutes }} min read</span>
  </div>
</div>
