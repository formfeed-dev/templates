name: Validate
# Compiles every template with its own sample data, offline, with the published CLI: unknown
# variables, filters and helpers fail the check. No account or API key is involved.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npx --yes formfeed@latest validate
